name: Build AMI BIOS

on:
  push:
    branches:
      - master
    paths:
      - 'AMI/**'
      - 'SOFTWARE/uefi-editor-cli/**'
      - '.github/workflows/build-ami.yml'
    tags:
      - 'A1_*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # build-docker.sh resolves the version itself: git tag at HEAD (A1_*)
      # on tag pushes, otherwise the short SHA.
      - name: Build patched BIOS
        run: ./AMI/build-docker.sh

      - name: Upload BIOS ROM
        uses: actions/upload-artifact@v4
        with:
          name: IMB760_BIOS_AMI_mod
          path: AMI/build/*/IMB760_BIOS_AMI_mixa3607_mod-*.rom
          if-no-files-found: error
          retention-days: 30
