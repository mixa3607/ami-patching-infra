<html>
	<head>
 	<title>sensor_readings help</title>
	<link type='text/css' rel='stylesheet' href='../../style/help_style.css'/>
	</head>
	<body>
		<h2><div class='floatRight'><a href='javascript://' class='closeBtn' 
		onclick='top.closeHelp();'>X</a></div>
		
	<script type="text/javascript">
		var helpContent = "";
		var frameName = top.frames['mainFrame'].pageFrame;
		frameName = frameName.document.getElementsByTagName("FORM");
		if (frameName.length)
		{
			if ("advancedThresholdFrm" == frameName[0].getAttribute('id'))
			{
				helpContent = "<div class='helpmainhead'>Threshold Settings" +
					"</div></h2>" +
					"<div class='subSection'>" +
					"Use this page to configure threshold settings configuration."+
					"<br><br>" +
					"<fieldset>" +
					"<legend>Actions</legend>" +
					"<h4>Lower Non-Recoverable (LNR) </h4>" +
					"Set lower non-recoverable threshold" +
					"<h4>Lower Critical (LC) </h4>" +
					"Set lower critical threshold" +
					"<h4>Lower Non-Critical (LNC) </h4>" +
					"Set lower non-critical threshold" +
					"<h4>Upper Non-Recoverable (UNR) </h4>" +
					"Set upper non-recoverable threshold" +
					"<h4>Upper Critical (UC) </h4>" +
					"Set upper critical threshold" +
					"<h4>Upper Non-Critical (UNC) </h4>" +
					"Set upper non-critical threshold" +
					"<h4>Save</h4>" +
					"Save the settings. " + "<br>" +
					"All data in the text box will be converted into " +
					"IPMI data type, for more information, please refer to " +
					"IPMI SPEC. 2.0, chapter 36, Sensor Types and " +
					"Data Conversion." +
					"<h4>Cancel</h4>" +
					"Cancel the modified changes. " +
					"<br>"+
					"</fieldset>" +
					"</div>";
			}
		} else {
			helpContent = "<div class='helpmainhead'>Sensor Readings</div>" +
				"</h2><div class='subSection'>" +
                                "A list of sensor readings will be displayed here.Current reading" +
				" will be displayed for Analog sensor whereas event state will be" +
				" displayed for discrete sensor.Click on a" +
				" record to show more information about that particular sensor," +
				" including thresholds and a graphical representation of all " +
				"associated asserted events. Double click on a record to toggle" +
				" (ON / OFF) the live widget for that particular sensor.<br/>" +
				"<strong>NOTE:</strong> N/A represents Not Applicable." +
				"<br/><br/>" +
				"<fieldset>" +
				"<legend>ACTIONS</legend>" +
				"<h4>Threshold Settings</h4>" +
				"Click this option to configure Threshold Settings." +
				"Options are " +
				"<ul>" +
				"<li>- Lower Non-Recoverable (LNR)</li>" +
				"<li>- Lower Critical (LC)</li>" +
				"<li>- Lower Non-Critical (LNC)</li>" +
				"<li>- Upper Non-Recoverable (UNR)</li>" +
				"<li>- Upper Critical (UC)</li>" +
				"<li>- Upper Non-Critical (UNC)</li>" +
				"</ul>" +
				"<h4>Live Widget</h4>" +
				"Turn On or Off the <a href='widget_page_hlp.html'>live widget" +
				"</a> for this sensor. This widget gives a dynamic " +
				"representation of the readings for the sensor." +
				"<h4>View this Event Log</h4>" +
				"Click this button to view the event log page for the " +
				"selected sensor." +
				"</fieldset>" +
				"</div>";
    	}
    	document.write(helpContent);
    </script>
	</body>
</html>
