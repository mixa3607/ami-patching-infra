<html>
	<head>
	<title>configure_pef help</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	</head>
	<body oncontextmenu="return false;">
	<h2><div class="floatRight">
		<a href="javascript://" class="closeBtn" onclick="top.closeHelp();">
		X</a></div>
	<script type="text/javascript">
	var frameName = top.frames["mainFrame"].pageFrame.document.getElementsByTagName("FORM");
	var titleContent = "", bodyContent = "", buttonContent = "";
	var helpContent;
	if (frameName.length) {
		if (frameName[0].getAttribute("id").indexOf("EventFilterForm") != -1) {
			bodyContent = "<h4>Filter configuration</h4>" +
				"Check the option 'Enable' to enable the PEF settings." +
				"<h4>Event Severity</h4>" +
				"Choose any one of the Event Severity from the dropdown list." +

				"<h4><br>Filter Action configuration</h4>" +
				"<h4>Event Filter Action</h4>" +
				"This is a mandatory field and is checked by default. This " +
				"action enables PEF Alert action (readonly)." +
				"<h4>Power Action</h4>" +
				"Choose Power action to be either Power down, Power " +
				"reset or Power cycle from the dropdown list." +
				"<h4>Alert Policy Number</h4>" +
				"Choose configured alert policy number from the dropdown list." +
				"<br><strong>NOTE:</strong> " +
				"Alert Policy can be configured under " +
				"Configuration->PEF->Alert Policy." +

				"<h4><br>Generator ID configuration</h4>" +
				"<h4>Generator ID Data</h4>" +
				"Enable this option to enter the Generator ID with raw data." +
				"<h4>Generator ID 1</h4>" +
				"Enter the raw generator ID1 data value." +
				"<h4>Generator ID 2</h4>" +
				"Enter the raw generator ID2 data value." +
				"<br><strong>NOTE:</strong> " +
				"In the RAW data field, to specify hexadecimal value prefix " +
				"the value with '0x'." +
				"<h4>Event Generator</h4>" +
				"Choose the event generator as Slave Address - if event is " +
				"generated from IPMB else Choose System Software ID - if " +
				"event is generated from system software." +
				"<h4>Slave Address/Software ID</h4>" +
				"Specify corresponding I<sup>2</sup>C Slave Address or " +
				"System Software ID." +
				"<h4>Channel Number</h4>" +
				"Choose the particular channel number through which the event " +
				"message is received over. Choose '0' if the event message is " +
				"received via the system interface, primary IPMB, or " +
				"internally generated by the BMC." +
				"<h4>IPMB Device LUN</h4>" +
				"Choose the corresponding IPMB device LUN if event " +
				"generated by IPMB." +

				"<h4><br>Sensor configuration</h4>" +
				"<h4>Sensor Type</h4>" +
				"The type of sensor that will trigger the event filter action." +
				"<h4>Sensor Name</h4>" +
				"Choose the particular sensor from the sensor list." +
				"<h4>Event Options</h4>" +
				"Choose event option to be either All events or Sensor " +
				"specific events." +
				"<h4>Sensor Events</h4>" +
				"The list of all the possible events for the selected sensors." +

				"<h4><br>Event Data configuration</h4>" +
				"<h4>Event Trigger</h4>" +
				"This field is used to give Event/Reading type value." +
				"<ul><li>- Value ranges from 1 to 255.</li></ul>" +
				"<h4>Event Data 1 AND Mask</h4>" +
				"This field is used to indicate wildcarded or compared bits." +
				"<ul><li>- Value ranges from 0 to 255.</li></ul>" +
				"<h4>Event Data 1 Compare 1 & Event Data 1 Compare 2</h4>" +
				"This field is used to indicate whether each bit position's " +
				"comparison is an exact comparison or not.<br>" +
				"<ul><li>- Value ranges from 0 to 255.</li></ul>" +

				"<h4><br>Event Data 2 configuration</h4>" +
				"<h4>Event Data 2 AND Mask</h4>" +
				"This field is similar to Event Data 1 AND Mask." +
				"<h4>Event Data 2 Compare 1 & Event Data 2 Compare 2</h4>" +
				"These fields are similar to Event Data 1 Compare 1 and Event " +
				"Data 1 Compare 2 respectively." +

				"<h4><br>Event Data 3 configuration</h4>" +
				"<h4>Event Data 3 AND Mask</h4>" +
				"This field is similar to Event Data 1 AND Mask." +
				"<h4>Event Data 3 Compare 1 & Event Data 3 Compare 2</h4>" +
				"These fields are similar to Event Data 1 Compare 1 and Event " +
				"Data 1 Compare 2 respectively.<br>";

		if ("addEventFilterForm" == frameName[0].getAttribute("id")) {
			titleContent = "<div class='helpmainhead'>Add Event Filter</div></h2>" +
				"<div class='subSection'>" +
				"Use this form to add a new Event Filter entry. " +
				"<br><br>For more information, refer Platform Event " +
				"Filtering (PEF) " +
				"section in IPMI Specification." +
				"<br><br>" +
				"<fieldset>" +
				"<legend>Actions</legend>" +
				"<h4>Event Filter Configuration</h4>" +
				"<h4>PEF ID</h4>" +
				"Displays ID for the newly configured PEF entry (readonly). ";

			buttonContent = "<h4>Add</h4>" +
				"Click on 'Add' to save the new event filter entry and " +
				"return to Event filter list. ";
		} else if ("modifyEventFilterForm" == frameName[0].getAttribute("id")) { 
			titleContent = "<div class='helpmainhead'>Modify Event Filter</div></h2>" +
				"<div class='subSection'>" +
				"This form is used to modify the existing Event Filter entry." +
				"<br><br>For more information, refer Platform Event " +
				"Filtering (PEF) " +
				"section in IPMI Specification." +
				"<br><br>" +
				"<fieldset>" +
				"<legend>Actions</legend>" +
				"<h4>Event Filter Configuration</h4>" +
				"<h4>PEF ID</h4>" +
				"Displays ID for the configured PEF entry(readonly). ";
			buttonContent = "<h4>Modify</h4>" +
				"Click 'Modify' to accept the modification and return to " +
				"Event filter list. "; 
		}
		helpContent = titleContent + bodyContent + buttonContent;
		helpContent += "<h4>Cancel</h4>" +
			"Click 'Cancel' to cancel the modification and return to " +
			"Event filter list. " +
			"</fieldset>" +
			"</div>";
		}
		else if (frameName[0].getAttribute("id").indexOf("AlertPolicyForm") != -1) {
			bodyContent = "<br><br>For more information, refer Platform " +
				"Event Filtering (PEF) section in IPMI Specification." +
				"<br><br>" +
				"<fieldset>" +
				"<legend>Actions</legend>" +
				"<h4>Policy Entry #</h4>" +
				"This field displays Policy entry number of the selected slot" +
				"(readonly)." +
				"<h4>Policy Number</h4>" +
				"Choose the policy number that was configured in Event " +
				"filter table." +
				"<h4>Policy Configuration</h4>" +
				"Check the option 'Enable' to enable the policy settings." +
				"<h4>Policy Set</h4>" +
				"Choose any one of the Policy set values from the list.<br>" +
				"0 - Always send alert to this destination.<br>" +
				"1 - If alert to previous destination was successful, do " + 
				"not send alert to this destination. Proceed to next entry " +
				"in this policy set.<br>" +
				"2 - If alert to previous destination was successful, do " +
				"not send alert to this destination. Do not process any " +
				"more entries in this policy set.<br>" +
				"3 - If alert to previous destination was successful, do " + 
				"not send alert to this destination. Proceed to next entry " +
				"in this policy set that is to a different channel.<br>" +
				"4 - If alert to previous destination was successful, do " +
				"not send alert to this destination. Proceed to next entry in " +
				"this policy set that is to a different destination type.<br>" +
				"<h4>Channel Number</h4>" +
				"Choose a particular channel from the available channel list." +
				"<h4>Destination Selector</h4>" +
				"Choose a particular destination from the configured " +
				"destination list." +
				"<br><strong>NOTE:</strong> " +
				"LAN Destination have to be configured - under " +
				"Configuration->PEF->LAN Destination." +
				"<h4>Alert String</h4>" +
				"Check the box to specify an event-specific Alert String." +
				"<h4>Alert String Key</h4>" +
				"Choose from a set of values, all linked to strings kept in " +
				"the PEF configuration parameters, to specify which string " +
				"is to be sent for this Alert Policy entry. ";

			if ("addAlertPolicyForm" == frameName[0].getAttribute("id")) {
				titleContent = "<div class='helpmainhead'>Add Alert Policy" +
					"</div></h2><div class='subSection'>" +
					"This form is used to add a new Alert Policy entry. ";
				buttonContent = "<h4>Add</h4>" +
					"Click 'Add' to save the new alert policy and return to " +
					"Alert Policy list. ";
			} else if ("modifyAlertPolicyForm" == frameName[0].getAttribute("id")) {
				titleContent = "<div class='helpmainhead'>Modify Alert Policy "+
					"</div></h2><div class='subSection'>" +
					"This form is used to modify the existing Alert Policy entry. ";
				buttonContent = "<h4>Modify</h4>" +
					"Click 'Modify' to accept the modification and return to " +
					"Alert Policy list. ";
			}
			helpContent = titleContent + bodyContent + buttonContent;
			helpContent += "<h4>Cancel</h4>" +
			"Click 'Cancel' to cancel the modification and return to Alert " +
			"Policy list. </fieldset></div>";
		} else if (frameName[0].getAttribute("id").indexOf("LANDestForm") != -1) {
			bodyContent = "<br><br>" +
			"<fieldset>" +
			"<legend>Actions</legend>" +
			"<h4>LAN Channel Number</h4>" +
			"Displays LAN Channel Number of the selected slot(readonly)." +
			"<h4>LAN Destination</h4>" +
			"Displays Destination number of the selected slot(readonly)." +
			"<h4>Destination Type</h4>" +
			"The destination type can be either an SNMP Trap or an Email " +
			"alert. For SNMP Trap, destination IP address has to be filled. " +
			"For Email alert, 3 fields Username, subject and " +
			"body of the message have to be filled. " +
			"The SMTP server information also has to be added under " +
			"Configuration->SMTP. " +
			"<h4>Destination Address</h4>" +
			"If Destination type is SNMP Trap, then give the IP address of " +
			"the system that will receive the alert. " +
			"Destination address will support the following:" +
			"<ul><li>- IPv4 address format." +
			"<li>- IPv6 address format.</ul>" +
			"<h4>Username</h4>" +
			"If Destination type is Email Alert, then choose the user to " +
			"whom the email alert has to be sent." +
			"<br><strong>NOTE:</strong> " +
			"Email address for the user has to be configured under " +
			"Configuration->Users." +
			"<h4>Subject &amp; Message</h4>" +
			"These fields must be configured if email alert is chosen as " +
			"destination type. An email will be sent to the configured email " +
			"address of the user in case of any severity events with a " +
			"subject specified in subject field and will contain the message " +
			"field's content as the email body. " +
			"<br><strong>NOTE:</strong> " +
			"These fields are not applicable for 'AMI-Format' email users.";
			if ("addLANDestForm" == frameName[0].getAttribute("id")) {
				titleContent = "<div class='helpmainhead'>Add LAN Destination" +
					"</div></h2><div class='subSection'>" +
					"Use this form to add a new LAN destination entry. ";
				buttonContent = "<h4>Add</h4>" +
					"Click on 'Add' to save the new LAN destination and " +
					"return to LAN destination list. ";
			} else if ("modifyLANDestForm" == frameName[0].getAttribute("id")) {
				titleContent = "<div class='helpmainhead'>Modify LAN Destination" +
					"</div></h2><div class='subSection'>" +
					"This form is used to modify the existing LAN " +
					"destination entry. ";
				buttonContent = "<h4>Modify</h4>" +
					"Click 'Modify' to accept the modification and return " +
					"to LAN destination list. ";
			}
			helpContent = titleContent + bodyContent + buttonContent;
			helpContent += "<h4>Cancel</h4>" +
				"Click 'Cancel' to cancel the modification and return to " +
				"LAN destination list. " +
				"</fieldset></div>";
		}
	}
	else
	{
		helpContent = "<div class='helpmainhead'>PEF</div></h2>" +
			"<div class='subSection'>" +
			"This page is used to configure Event Filter, Alert Policy and " +
			"LAN Destination for alerts. To view the page, user must at " +
			"least be an Operator.<br>" +
			"To modify or add a PEF, user must be an Administrator. " +
			"<br><strong>NOTE:</strong> Free slots are denoted by '~' in all " +
			"columns of the particular slot. " +
			"<br><br>For more information, refer Platform Event Filtering " +
			"(PEF) section in IPMI Specification." +
			"<br><br><fieldset>" +
			"<legend>Actions</legend>" +
			"<h4>Event Filter</h4>" +
			"Click the Event Filter tab to show any configured Event filters " +
			"and available slots. " +
			"You can modify or add new event filter entry from here.<br>" +
			"By default, 15 event filter entries are configured among the " +
			"40 available slots. " +
			"<h4>Alert Policy</h4>" +
			"Click the Alert policy tab to show any configured Alert " +
			"policies and available slots. " +
			"You can modify or add new alert policy entry from here.<br>" +
			"A maximum of 60 slots are available. " +
			"<h4>LAN Destination</h4>" +
			"Click the LAN Destination tab to show any configured LAN " +
			"destinations and available slots. " +
			"You can modify or add new LAN destination entry from here.<br>" +
			"A maximum of 15 slots are available.";

		if ((top.frames["mainFrame"].pageFrame.document.getElementById
			("_lanDests").style.fontWeight == "bold") || 
			(top.frames["mainFrame"].pageFrame.document.getElementById
			("_lanDests").style.fontWeight == 700)) {
			helpContent += "<h4>LAN Channel</h4>" +
				"Select the LAN Channel from the list to be configured. " +
				"<h4>Send Test Alert</h4>" +
				"Select a configured slot in LAN Destination tab and click " +
				"'Send Test Alert' to send sample alert to configured " +
				"destination. " +
				"<br><strong>NOTE:</strong> " +
				"Test alert can be sent only when SMTP configuration is " +
				"enabled. SMTP support can be enabled under " +
				"Configuration->SMTP. Also make sure that SMTP server " +
				"address and port numbers are configured properly.";
		}

		helpContent += "<h4>Add</h4>" +
			"Select a free slot and click 'Add' to add a new entry to the " +
			"device. Alternatively, double click on a free slot. " +
			"<h4>Modify</h4>" +
			"Select a configured slot and click 'Modify' to modify the " +
			"selected entry. Alternatively, double click on the configured " +
			"slot." +
			"<h4>Delete</h4>" +
			"Select the configured slot to be deleted and click 'Delete'. " +
			"</fieldset>" +
			"</div>";
	}
	document.write(helpContent);
	</script>
	</body>
</html>
