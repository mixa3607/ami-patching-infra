<html>
	<head>
	<title>configure_license help</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	</head>
	<body oncontextmenu="return false;">
	<h2><div class="floatRight"><a href="javascript://" class="closeBtn" 
	onclick="top.closeHelp();">X</a></div>
	<script type="text/javascript">
	var frameName;
	var helpContent = "";

	frameName = top.frames["mainFrame"].pageFrame;
	frameName = frameName.document.getElementsByTagName("FORM");
	if (frameName.length) {
		if ("uploadLicenseFrm" == frameName[0].getAttribute("id")) {
			helpContent = "<div class='helpmainhead'>Upload License Key</div></h2>" +
				"<div class='subSection'>" +
				"This page is used to upload a new license key " +
				"to activate selected features." +
				"<br><br>" +
				"<fieldset>" +
				"<legend>Actions</legend>" +
				"<h4>License Key</h4>" +
				"Enter the license key to activate the feature. " +
				"<ul><li>- License Key is a string with minimum length of 26 alpha-numeric characters. </li>" +
				"<li>- Special characters except hyphens are not allowed. Hyphens are not counted in length. </li>" +
				"</ul>" +
				"<h4>Upload</h4>" +
				"Click 'Upload' to upload the License key. " +
				"<h4>Cancel</h4>" +
				"Click 'Cancel' to cancel the modifications and return to " +
				"the License page. " +
				"</fieldset>" +
				"</div>";
		}
	} else {
		helpContent = "<div class='helpmainhead'>License</div>" +
			"</h2><div class='subSection'>" +
			"This page is used to display the available features and " +
			"their validity period." +
			"<br><br>" +
			"<fieldset>" +
			"<legend>Actions</legend>" +			
			"<h4>Feature Name</h4>" +
			"This field is used to list all the available features. " +
			"<h4>Validity</h4>" +
			"This field is used to show the validity of the particular " +
			"feature. " +
			"<ul><li>- Validity period (Max 255) mentioned in days.</li></ul> " +
			"<h4>Upload License Key</h4>" +
			"This button is used to upload a license key to activate the " +
			"selected features." +
			"</fieldset>" +
			"</div>";
	}
	document.write(helpContent);
	</script>
	</body>
</html>
