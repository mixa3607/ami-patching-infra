<html>
<head>
	<title>fw_update help</title>
	<link href="../../style/help_style.css" type="text/css" rel="stylesheet" />
	<script language="javascript" src="../../lib/common_fn.js"></script>
	<script language="javascript" src="../../lib/ui.js"></script>
</head>
<body oncontextmenu="return false;">
	<h2><div class="floatRight">
	<a href="javascript://" class="closeBtn" onclick="top.closeHelp();">X</a>
	</div>
	<div class="helpmainhead">Firmware Update</div></h2>
	<div class="subSection">
	<script type="text/javascript">
	var lbldesc;
	var chkHPM=checkProjectCfg("HPM_SUPPORT");
	if (checkProjectCfg("HPM_SUPPORT")) {
	lbldesc="This wizard takes you through the process of HPM based firmware upgradation."+
		"A reset of the box will automatically follow whether the upgrade is"+ 
		"completed or cancelled.";
	} else {
	lbldesc="This wizard takes you through the process of firmware upgradation."+
		"A reset of the box will automatically follow whether the upgrade is"+ 
		"completed or cancelled. An option to Preserve configuration will be"+ 
		"presented. Enable the option, if you wish to preserve configured"+ 
		"settings through the upgrade.";
	}
	document.write(lbldesc);
	</script>
		<br/><br/>
		<fieldset>
		<legend>Actions</legend>
		<script type="text/javascript">
		if (checkProjectCfg("ENC_IMAGE")) {
			var signimage_help = "<h4>Upload Sign Image Key</h4>";
			signimage_help += "Check this button to upload the Sign Image " +
				"public key of the encrypted firmware.";
			document.write(signimage_help);
		}
		
		 if(checkProjectCfg("HPM_SUPPORT") && (top.frames["mainFrame"].
			pageFrame.document.getElementById("_rdoHPM").checked==true)){
			var cont="<h4>Continue</h4>"+
			"Click 'Continue' to upgrade the current device firmware."
			document.write(cont);
			}
		else 
		if (checkProjectCfg("PRESERVECONF") || checkProjectCfg("DUAL_IMAGE")) {
			var preserve_conf = "<h4>Enter Preserve Configuration</h4>";
			preserve_conf += "Click this button to be redirected to the " +
				"Preserve configuration page, where the configurations " +
				"are preserved from being overwritten by the default " +
				"configurations. ";
			preserve_conf +="<h4>Enter Update Mode</h4>"+
			"Click 'Enter Update Mode' to upgrade the current device firmware."
			document.write(preserve_conf);
		}
		</script>
		<!-- <h4>Enter Update Mode</h4>
		Click 'Enter Update Mode' to upgrade the current device firmware. -->
		<script type="text/javascript">
		if (checkProjectCfg("SECTIONFLASH") && (top.frames["mainFrame"].
			pageFrame.document.getElementById("_wizardSectionFlash"))) {
			document.write("<h4>Section Based Firmware Update</h4>" +
				"This holds the available sections of existing and uploaded " +
				"image. Check the available sections that needs to be " +
				"flashed.");
		}
		</script>
		</fieldset>
	</body>
</html>
