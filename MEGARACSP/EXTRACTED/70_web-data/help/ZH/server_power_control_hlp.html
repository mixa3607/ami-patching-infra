<html>
	<head>
 	<title>電源控制說明</title>
 	<link type='text/css' rel='stylesheet' href='../../style/help_style.css'/>
	</head>
	<body>
	<h2><div class='floatRight'><a href='javascript://' class='closeBtn' onclick='top.closeHelp();'>X</a></div>
	<div class='helpmainhead'>伺服器電源控制</div></h2>
	<div class='subSection'>
		此頁可以查看或執行任何伺服器電源相關的控制。
		<br>
		<fieldset>
		<legend>用途</legend>
		<h4> 重新啟動伺服器 </h4>
	  	選擇此選項以重新啟動伺服器（暖開機）。
		<h4>立即關閉伺服器電源</h4>
		選擇此選項以立即關閉伺服器電源。
		<h4>正常程序關閉伺服器電源</h4>
		選擇此選項以啟用作業系統的關機程序來正常程序關閉伺服器電源。
		<h4>打開伺服器電源</h4>
		選擇此選項以打開伺服器電源。
		<h4>Power Cycle Server </h4>
		選擇此選項會先關閉伺服器電源之後重開伺服器。
		<h4>執行操作</h4>
		點選 '執行操作' 以執行所選的選項。
		</fieldset>
	</div>
	</body>
</html>
