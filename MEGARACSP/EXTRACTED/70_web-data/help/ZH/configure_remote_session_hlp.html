<html>
	<head>
	<title>Remote Session 說明</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	<script language="javascript" src="../../lib/common_fn.js"></script>
	<script language="javascript" src="../../lib/ui.js"></script>
	</head>
<body>
	<h2><div class="floatRight">
	<a href="javascript://" class="closeBtn" onclick="top.closeHelp();">X</a>
	</div>
	<div class="helpmainhead">Remote Session</div></h2>
	<div class="subSection">
	此頁用於設定下次使用虛擬媒體裝置時的配置。
	<br/><br/>
	<fieldset>
	<legend>用途</legend>
	<script type="text/javascript">
	SINGLE_PORT_APP = checkProjectCfg("SINGLE_PORT_APP");
	KEYBOARD_LANG = checkProjectCfg("KB_LANG_SELECT_SUPPORT");
	POWER_CONSUMPTION = checkProjectCfg("POWER_CONSUMPTION");
	HOSTLOCK = checkProjectCfg("RUNTIME_HOST_LOCK");
	HOSTLOCKAUTO = checkProjectCfg("HOST_LOCK_AUTO");
	RUNTIME_SINGLEPORT = checkProjectCfg("RUNTIME_SINGLEPORT_SUPPORT");
	KVM_SESSION_RECONNECT = checkProjectCfg("KVM_SESSION_RECONNECT");

	if (RUNTIME_SINGLEPORT) {
		document.write("<h4>Single Port 應用</h4> " +
			"此選項是用來在運行時啟用／停用 single port 應用。");
	}

	if (!SINGLE_PORT_APP || (SINGLE_PORT_APP && RUNTIME_SINGLEPORT)) {
		document.write("<h4>KVM 加密</h4> " +
			"在下一次使用 KVM 時，啟用／停用 KVM 資料的加密。");
		/*document.write("<h4>Media Encryption</h4> " +
			"Enable/Disable encryption on Media data for the next " +
			"redirection session.");*/
	}

	if (!SINGLE_PORT_APP || (SINGLE_PORT_APP && RUNTIME_SINGLEPORT)) {
		document.write("<br><strong>提醒：</strong> 此選項會自動關閉" +
			"現有的遠端連線，不論是 KVM 或是虛擬媒體裝置。");
	}
	
	if (KEYBOARD_LANG) {
		document.write("<h4>鍵盤語言</h4> " +
			"此選項用來選擇鍵盤要支援的語言。");
	}
	if (!POWER_CONSUMPTION) {
		document.write("<h4>虛擬媒體附接模式</h4>" +
			"有兩種虛擬媒體附接模式可選擇：" +
			"<ul><li>附接 - 在開機時直接附接虛擬媒體到伺服器。</li>" +
			"<li>自動附接 - 只有在虛擬媒體會話開始之後才附接虛擬媒體" +
			"到伺服器。</li></ul>");
	}
	if (HOSTLOCK) {
		document.write("<h4>Local Monitor 功能狀態 OFF</h4> " +
			"點選此選項以啟用 Local Monitor ON/OFF 的支援。");
	}
	if (HOSTLOCKAUTO) {
		document.write("<h4>當 JViewer 啟動時,自動關閉伺服器監視器</h4> " +
			"點選此選項之後，當 JViewer 啟動時，會自動關閉伺服器端的" +
			"監視器。");
	}
	if (KVM_SESSION_RECONNECT) {
		document.write("<h4>重試次數</h4>" +
			"如果 KVM 連線失敗時將會重試的次數。" +
			"<ul><li> - 重試次數的範圍為 1 ～ 3。</li></ul>" +
			"<h4>重試的時間間隔</h4>" +
			"重試之間所需要等待的時間間隔。" +
			"<ul><li> - 重試的時間間隔範圍為 5 ～ 15 秒。</li></ul>");
	}
	</script>
	<h4>儲存</h4>
	點選 '儲存' 以儲存變更。
	<h4>重置</h4>
	點選 '重置' 以重置變更。
	</fieldset>
	</div>
</body>
</html>
