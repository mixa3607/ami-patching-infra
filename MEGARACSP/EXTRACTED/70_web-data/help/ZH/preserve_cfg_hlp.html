<html>
	<head>
	<title>儲存配置說明</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	<script language="javascript" src="../../lib/common_fn.js"></script>
	<script language="javascript" src="../../lib/ui.js"></script>
	</head>
	<body>
	<h2><div class="floatRight"><a href="javascript://" class="closeBtn" 
		onclick="top.closeHelp();">X</a></div>
	<div class="helpmainhead">儲存配置</div></h2>
	<div class="subSection">
		在完成還原配置之後，請點選需要儲存的配置。 
		<script type="text/javascript">
		if (checkProjectCfg("DUAL_IMAGE")) {
			<br><strong>提醒：</strong>
			雙映象不支援保存各別的配置。 
		}
		</script>
		<br/><br/>
		<fieldset>
		<legend>用途</legend>
		<h4>配置列表</h4>
		您可以以 選取／取消 複選框的方式來為您的系統 儲存／覆蓋 配置。 
		<h4>全部勾選</h4>
		點選此按鈕以勾選全部配置。
		<h4>全部取消勾選</h4>
		點選此按鈕以取消全部勾選。
		<h4>儲存</h4>
		點選 '儲存' 以儲存變更。
		<br><strong>提醒：</strong>
		此配置會被還原配置功能所使用。
		<h4>重置</h4>
		點選 '重置' 以重置變更。
		</fieldset>
	</div>
	</body>
</html>
