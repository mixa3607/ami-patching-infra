<html>
	<head>
	<title>PAM 說明</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	</head>
	<body>
	<h2><div class="floatRight"><a href="javascript://" class="closeBtn" 
		onclick="top.closeHelp();">X</a></div>
	<div class="helpmainhead">PAM 順序</div></h2>
	<div class="subSection">
	用戶登入 BMC 時需透過驗證，此頁面是用來配置 PAM 的驗證順序。
	<br/><br/>
	<fieldset>
	<legend>用途</legend>
	<h4>PAM 模組</h4>
	列出在 BMC 所支援的所有 PAM 模組。
	<h4>上移</h4>
	點選所需要的 PAM 模組，再點選上移將所選擇的 PAM 模組上移一步。
	<h4>下移</h4>
	點選所需要的 PAM 模組，再點選下移將所選擇的 PAM 模組下移一步。
	<h4>儲存</h4>
	點選 '儲存' 以儲存變更。
	<br><strong>提醒</strong> 當有任何配置變更時，網頁伺服器將會自動重開，
	已登入的會話將會自動登出。
	<h4>重置</h4>
	點選 '重置' 以重置變更。
	</fieldset>
	</div>
	</body>
</html>
