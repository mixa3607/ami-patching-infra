<html>
<head>
	<title>網路連結說明</title>
	<link type='text/css' rel='stylesheet' href='../../style/help_style.css'/>
</head>
<body>
	<h2><div class='floatRight'><a href='javascript://' class='closeBtn' 
	onclick='top.closeHelp();'>X</a></div>
	<div class='helpmainhead'>網路連結</div></h2>
	<div class='subSection'>
	此頁面是用來對可使用的網路介面配置網路連結選項。 
	<br/><br/>
		<fieldset>
			<legend>用途</legend>
			<h4>LAN 介面</h4>
			從清單中選擇想要配置連結速度和雙工模式的網路介面。 
			<h4>自動協商</h4>
			啟用此選項以允許設備自動配置以盡可能達到最好的操作（連結速度和雙
			工模式）模式。 
			<h4>連結速度</h4>
			連結速度將會列出網路介面所支援的所有速度，可以為10/100/1000 Mbps。 
			<br/><br/>
			<strong>提醒：</strong> 當自動協商關閉，連結速度不可設定為 
			1000 Mbps。 
			<h4>雙工模式</h4>
			選擇以下任一種雙工模式。
			<ul>
				<li>- 半雙工</li>
				<li>- 全雙工</li>
			</ul>
			<h4>儲存</h4>
			點選 '儲存' 以儲存變更。
			<h4>重置</h4>
			點選 '重置' 以重置變更。
			<br>
		</fieldset>
	</div>
</body>
</html>
