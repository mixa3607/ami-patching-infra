<html>
	<head>
	<title>回復配置說明</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
	<script language="javascript" src="../../lib/common_fn.js"></script>
	<script language="javascript" src="../../lib/ui.js"></script>
	</head>
	<body>
	<h2><div class="floatRight"><a href="javascript://" class="closeBtn" 
		onclick="top.closeHelp();">X</a></div>
	<div class='helpmainhead'>回復配置</div></h2>
	<div class='subSection'>
		此頁用來回復設備的配置。
		<br>
		請注意如果您進入回復配置，widgets，其它的網頁和服務將停用，所有已
		開啟的 widgets 將會自動關閉。設備將在幾分鐘內重開。
		<br/><br/>
		<fieldset>
		<legend>用途</legend>
		<script type="text/javascript">
		if (checkProjectCfg("PRESERVECONF")) {
			var prsrvcfg_help = "<h4>保存配置</h4>";
			prsrvcfg_help += "點選此按鈕將會重新導向至保存配置頁面，用" +
				"來保存個別的配置不要被預設配置覆寫。";
			document.write(prsrvcfg_help);
		}
		</script>
		<h4>回復配置</h4>
		點選此按鈕以回復韌體的預設配置。
		</fieldset>
	</div>
	</body>
</html>
