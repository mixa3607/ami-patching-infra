<html>
	<head>
	<title>root 說明</title>
	<link type='text/css' rel='stylesheet' href='../../style/help_style.css'/>
	</head>
	<body>
	<h2><div class='floatRight'>
	<a href='javascript://' class='closeBtn' onclick='top.closeHelp();'>X</a></div>
	<div class='helpmainhead'>System Administrator</div></h2>
	<div class='subSection'>
	此頁用來設定系統管理員的配置。
	<br/><br/>
	<fieldset>
	<legend>用途</legend>
	<h4>使用者名稱</h4>
	顯示系統管理員的使用者名稱（唯讀）。
	<h4>存取權限</h4>
	點選此選項以啟用系統管理員的存取權限。
	<h4>更改密碼</h4>
	點選 '更改密碼' 選項來變更使用者密碼，點選之後將會啟用密碼欄位。
	<h4>密碼，確認密碼</h4>
	請在此輸入密碼和確認密碼。
	<ul>
		<li> - 密碼至少要有 8 個字元長。</li>
		<li> - 不允許使用空白字元。</li>
	</ul>
	<strong>提醒：</strong> 此欄位不允許超過 64 個字元。
	<h4>儲存</h4>
	點選 '儲存' 以儲存變更。
	<h4>重置</h4>
	點選 '重置' 以重置變更。
	</fieldset>
	</div>
	</body>
</html>
