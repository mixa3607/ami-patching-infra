<html>
<head>
	<title>觸發器說明</title>
	<link type="text/css" rel="stylesheet" href="../../style/help_style.css"/>
</head>
<body>
	<h2>
		<div class="floatRight"><a href="javascript://" class="closeBtn" 
			onclick="top.closeHelp();">X</a></div>
		<div class="helpmainhead">觸發器配置</div>
	</h2>
	<div class="subSection">
		設定在本頁裡的那一種事件將會觸發自動錄影功能開始錄影。 
		
		<br/><br/>
		<fieldset>
			<legend>用途</legend>
			<h4>事件列表</h4>
			您可以 點選／取消點選 來 新增／移除 系統裡的觸發器。 
			<h4>儲存</h4>
			點選 '儲存' 以儲存變更。
			<br><strong>提醒：</strong> 
			<ul><li>要執行自動錄影功能，必需要啟用 KVM 服務（配置－》服務）。</li>
			<li>時間和日期必需是在系統的時間和日期之後。</li>
			</ul>
			<h4>重置</h4>
			點選 '重置' 以重置變更。
		</fieldset>
	</div>
</body>
</html>
