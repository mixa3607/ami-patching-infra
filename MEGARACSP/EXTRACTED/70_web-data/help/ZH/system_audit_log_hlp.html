<html>
	<head>
 	<title>系統 & 稽核記錄 說明</title>
 	<link type='text/css' rel='stylesheet' href='../../style/help_style.css'/>
	</head>
	<body>
		<h2><div class='floatRight'><a href='javascript://' class='closeBtn' 
		onclick='top.closeHelp();'>X</a></div>
		<div class='helpmainhead'>系統 & 稽核記錄</div></h2>
		<div class='subSection'>
		如果有配置系統 & 稽核記錄，此頁將會顯示設備上所有已發生的系統 & 稽核記錄。 
		<br/>
		<strong>提醒：</strong> 要顯示系統 & 稽核記錄，必需先在 配置 -> 系統和稽核
		記錄 配置日誌。 
		<br/><br/>
		<fieldset>
		<legend>用途</legend>
		<h4>系統日誌</h4>
		點選系統日誌分頁以查看所有系統事件。系統事件可以依級別來分類。
		<h4>稽核記錄</h4>
		點選稽核記錄分頁以查看設備上所有的稽核記錄。
		</fieldset>
	</body>
</html>
