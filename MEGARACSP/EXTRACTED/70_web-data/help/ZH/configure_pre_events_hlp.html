<html>
	<head>
 	<title>Pre-Event 說明</title>
	<link href="../../style/help_style.css" type="text/css" rel="stylesheet" />
</head>
<body>
	<h2><div class="floatRight">
	<a href="javascript://" class="closeBtn" onclick="top.closeHelp();">X</a>
	</div><div class="helpmainhead">Pre-Event 影像錄製</div></h2>
	<div class="subSection">
		此頁被用來設定 Pre-Event 影像錄影配置的相關訊息。 使用者等級至少必需是
		Administrator 才能修改這些配置。
		<br/><br/>
		<fieldset>
			<legend>用途</legend>
			<h4>影像品質</h4>
			從下拉式選單中選擇影像品質來調整 Pre-event boot/crash 錄製視頻的
			品質。
			<h4>壓縮模式</h4>
			從下拉式選單中選擇壓縮模式，下拉式選單包括了 Pre-event 觸發錄像
			的各種壓縮模式。
			<h4>FPS</h4>
			選擇每秒要錄製的 frames 數。
			<h4>影像錄製時間</h4>
			設定影像要錄製的時間有多長。 
			<h4>儲存</h4>
			點選 '儲存' 以儲存配置。
			<h4>重置</h4>
			點選 '重置' 以重置變更。
		</fieldset>
	</div>
</body>
</html>
