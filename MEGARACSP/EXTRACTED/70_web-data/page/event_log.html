<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=7" />
	<link href="../style/page_style.css" type="text/css" rel="stylesheet" />

	<script>
	document.writeln("<script language='javascript' src='../str/" + 
		top.gLangSetting + "/global_str.js'><\/script>");
	</script>

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<script>
	onload = function() {
		if (top.gLangSettingSet == true) {
		var elmt = document.getElementById("_btnSaveLog");
		elmt.setAttribute("value", eLang.getString("event_log", "EVENT_LOG_SAVEEVENTS"));
		var elmt = document.getElementById("_btnClearLog");
		elmt.setAttribute("value", eLang.getString("event_log", "EVENT_LOG_CLEAREVENTS"));
			doInit();
		}
	}
	</script>
</head>
<style>
	.toggleBMC {
		display:"";
	}
	.toggleClient {
		display:none;
	}
</style>
<body oncontextmenu="return false;">
	<h3>
<script>document.writeln(eLang.getString("event_log", "EVENT_LOG_TITLE"));</script>
</h3>
	<p>
<script>document.writeln(eLang.getString("event_log", "EVENT_LOG_DESC"));</script>
</p>
	<table border="0" width="100%" cellspacing="3" cellpadding="3"><tr>
		<td><select id="_lstEventType"></select>&nbsp; 
<script>document.writeln(eLang.getString("event_log", "EVENT_LOG_FILTERBY"));</script>
&nbsp;<select id="_lstSensorName"></select></td>
		<td><label id="_lblHeader" class="alignRight"></label></td>
	</tr><tr>
		<td><input type="radio" id="_rdoBMCTzone" name="timeZone" checked>
		<label for="_rdoBMCTzone">
<script>document.writeln(eLang.getString("event_log", "EVENT_LOG_BMC_TZONE"));</script>
</label>
		<input type="radio" id="_rdoClientTzone" name="timeZone">
		<label for="_rdoClientTzone">
<script>document.writeln(eLang.getString("event_log", "EVENT_LOG_CLIENT_TZONE"));</script>
</label>
		&nbsp;&nbsp;<label id="_lblUTCOffset"></label></td>
		<td class="alignRight">

		<input type="text" id="_txtPage" maxlength="5" style="width:50px" />
		<input type="button" id="_btnNext" value=">" style="width:40px" />
		<input type="button" id="_btnLast" value=">>" style="width:40px" /></td>
	</tr></table>

	<script>
		if (window.ActiveXObject) {
			document.write("<br>");
		}
	</script>

	<div id="_lgdEventLog"></div>

	<script>
		if (!window.ActiveXObject) {
			document.write("<br>");
		}
	</script>

		<input type="button" id="_btnSaveLog" class="hiddenRow" />
		<input type="button" id="_btnClearLog" />
	</div>
