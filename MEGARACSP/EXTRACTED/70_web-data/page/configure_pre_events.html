<html>
<head>
	<link href="../style/page_style.css" type="text/css" rel="stylesheet" />
	<script src="../lib/include.js" type="text/javascript"></script>

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<script>
	onload = function() {
		if (top.gLangSettingSet == true) {
		var elmt = document.getElementById("_btnSave");
		elmt.setAttribute("value", eLang.getString("configure_pre_events", "CFG_PRE_EVENT_SAVE"));
		var elmt = document.getElementById("_btnReset");
		elmt.setAttribute("value", eLang.getString("configure_pre_events", "CFG_PRE_EVENT_RESET"));
			doInit();
		}
	}
	</script>
</head>
<body oncontextmenu="return false;">
	<h3>
<script>document.writeln(eLang.getString("configure_pre_events", "CFG_PRE_EVENT_TITLE"));</script>
</h3>
	<p id="_contVideoDesc"></p>
	<div class="subSection">
		<table cellspacing="0" cellpadding="5" border="0" width="450">
			<tr><td><strong>
<script>document.writeln(eLang.getString("configure_pre_events", "CFG_PRE_EVENT_QUALITY"));</script>
</strong></td>
			<td>
				<select id="_lstVideoQuality" class="classicTxtBox"></select>
			</td></tr>

			<tr><td><strong>
<script>document.writeln(eLang.getString("configure_pre_events", "CFG_PRE_EVENT_COMPMODE"));</script>
</strong></td>
			<td>
				<select id="_lstCompressionMode" class="classicTxtBox"></select>
			</td></tr>

			<tr><td><strong>Frames Per Second</strong></td>

</em>
			</td></tr>
		</table>
	</div>
	<br/>
	<div class="btnTray">
		<input type="button" id="_btnSave" />
		<input type="button" id="_btnReset" />
	</div>
