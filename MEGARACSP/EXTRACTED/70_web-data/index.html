	<script>
		var gLangSettingSet		= false;
		var gLangSetting		= "EN";
		var gPageDir			= "/page/";
		var gResDir				= "/res/";
		var gStrDir				= "/str/";
		var gStyleDir			= "/style/";
		var gLibDir				= "/lib/";
		var gImplDir			= "/impl/";
		var gHelpDir			= "/help/";
		var gOemDir				= "../";
		var gJavaJnlp			= "/Java/jviewer.jnlp";
		var gVideoJnlp			= "/Java/video_record.jnlp";
		var refresh_status		= 0;

		xmit.get({url:"/rpc/getdefaultlangcfg.asp", onrcv:function(arg)
 		{
 			if(arg.HAPI_STATUS==0)
 			{
 				default_Lang = WEBVAR_JSONVAR_GETDEFAULTLANG.WEBVAR_STRUCTNAME_GETDEFAULTLANG;
			}
			onload = loadInit();
		}});

		function loadInit()
		{
                        gLangSetting = getBrowserLang();
                        gLangSettingSet = true;
                        doInit();
		}
		function loadMainFrame() {
			window.frames["mainFrame"].location.href = "." + gPageDir +
			"main.html";
		}

		function loadFrames()
		{
			window.frames["headerFrame"].location.href = "." + gPageDir + 
				"header.html";
			var sessionexpire = fnCookie.read("SessionExpired");

			if ((fnCookie.read("SessionCookie") != undefined && 
				fnCookie.read("SessionCookie") != null) && 
				(sessionexpire == undefined || sessionexpire == null || 
				sessionexpire == "false") && (top.user.CSRFtoken == null ||
				top.user.CSRFtoken == undefined || top.user.CSRFtoken == "")) {
				getCSRFToken(loadMainFrame);
			} else {
				window.frames["mainFrame"].location.href = "." + gPageDir + 
					"login.html";
			}
		}

	</script>
</head>
