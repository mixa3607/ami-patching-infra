#!/bin/sh

 DO_DDNS=n
 SET_FQDN=n
 TSIG_AUTH=n
 SET_HOSTNAME=n
 SET_DOMAIN=n
 SET_v6DOMAIN=n
 SET_DNS=n
 SET_IPV6_PRIORITY=n
 SET_MDNS=n
 
case ${IFACE} in

	bond0)
		DO_DDNS=y
		SET_FQDN=n
		TSIG_AUTH=n
		SET_HOSTNAME=n
		SET_DOMAIN=y
		SET_v6DOMAIN=n
		SET_DNS=y
		SET_IPV6_PRIORITY=n
		SET_MDNS=n
		;;
	*)
		;;
esac
		